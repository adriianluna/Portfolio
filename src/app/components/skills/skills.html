<section id="skills" class="skills">
  <div class="skills__inner section-fade">
    <div class="skills__label">
      <span class="skills__number">02</span>
      <span class="skills__tag">// habilidades</span>
    </div>

    <h2 class="skills__title">Stack<br /><span class="skills__accent">Tecnológico</span></h2>

    <div class="skills__grid">
      @for (skill of skills; track skill.name) {
        <div class="skill-card">
          <i [class]="'skill-card__icon ' + skill.icon"></i>
          <span class="skill-card__name">{{ skill.name }}</span>
          <span class="skill-card__cat">{{ skill.category }}</span>
        </div>
      }
    </div>
  </div>
</section>
